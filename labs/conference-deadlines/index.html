<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Conference Deadlines | Yooshin Kim</title>
        <meta name="description" content="Research conference submission deadlines and countdowns in Korea Standard Time." />
        <meta name="theme-color" content="#ffffff" />
        <script src="../../scripts/theme.js"></script>
        <link rel="preload" href="../../fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin />
        <link rel="stylesheet" href="../../styles/site.css" />
        <link rel="stylesheet" href="../../styles/cv.css" />
        <link rel="stylesheet" href="../../styles/footer.css" />
        <link rel="stylesheet" href="../../styles/tools.css" />
        <link rel="stylesheet" href="./style.css" />
        <script src="./deadline-data.js" defer></script>
        <script src="./script.js" defer></script>
        <script src="../../scripts/footer.js" defer></script>
    </head>
    <body class="tool-body deadlines-body">
        <a class="skip-link" href="#main">Skip to content</a>
        <div class="page-shell cv-shell">
            <a class="paper-back" href="../../lab.html">Yooshin Kim / Tools</a>
            <main id="main" class="tool-layout">
                <section class="tool-hero">
                    <h1>Conference Deadlines</h1>
                    <p class="tool-lead">Submission times are shown in KST (UTC+9).</p>
                </section>

                <div class="deadline-groups">
                    <section class="deadline-group" aria-labelledby="upcoming-title">
                        <h2 id="upcoming-title">Upcoming</h2>
                        <p id="feed-status" class="deadline-note" role="status"></p>
                        <noscript><p class="deadline-note">Enable JavaScript to view the deadline list.</p></noscript>
                        <ul id="upcoming" class="deadline-list" aria-labelledby="upcoming-title"></ul>
                    </section>

                    <section id="pending-group" class="deadline-group" aria-labelledby="pending-title" hidden>
                        <h2 id="pending-title">Awaiting dates</h2>
                        <ul id="pending" class="deadline-list" aria-labelledby="pending-title"></ul>
                    </section>

                    <details id="past-group" class="deadline-group" hidden>
                        <summary id="past-title">Past deadlines</summary>
                        <ul id="past" class="deadline-list" aria-labelledby="past-title"></ul>
                    </details>

                    <p id="feed-source" class="deadline-source" hidden>
                        Data from <a href="https://github.com/ccfddl/ccf-deadlines">CCF-Deadlines</a> · Last refreshed <time id="feed-date"></time>
                    </p>
                </div>
            </main>
            <footer class="site-footer" data-site-footer>
                <a href="../../index.html">© Yooshin Kim</a>
            </footer>
        </div>

        <template id="deadline-venue">
            <li class="deadline-venue">
                <div class="deadline-venue-heading">
                    <h3><a class="deadline-link"></a></h3>
                    <span class="deadline-track"></span>
                </div>
                <ul class="deadline-list"></ul>
            </li>
        </template>

        <template id="deadline-entry">
            <li class="deadline-item">
                <span class="deadline-stage"></span>
                <div class="deadline-when">
                    <time></time>
                    <span class="deadline-note" hidden></span>
                </div>
                <span class="deadline-status"></span>
            </li>
        </template>
    </body>
</html>
