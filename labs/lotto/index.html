<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Lotto Number Picker | Yooshin Kim</title>
        <meta name="description" content="A small lotto number picker that generates random number sets from 1 to 45." />
        <link rel="preload" href="../../fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin />
        <link rel="stylesheet" href="../../styles/site.css" />
        <link rel="stylesheet" href="../../styles/cv.css" />
        <link rel="stylesheet" href="../../styles/footer.css" />
        <link rel="stylesheet" href="../../styles/tools.css" />
        <link rel="stylesheet" href="./style.css" />
        <script src="./script.js" defer></script>
        <script src="../../scripts/footer.js" defer></script>
    </head>
    <body class="tool-body lotto-body">
        <a class="skip-link" href="#main">Skip to content</a>
        <div class="page-shell cv-shell">
            <a class="paper-back" href="../../lab.html"><span aria-hidden="true">←</span> Yooshin Kim / Tool</a>

            <main id="main" class="tool-layout">
                <section class="tool-hero">
                    <div class="lotto-hero-copy">
                        <h1>Lotto Number Picker</h1>
                        <p class="tool-lead">Pick six unique numbers from 1 to 45, plus a bonus number. Generate one or several lines at a time.</p>
                    </div>
                </section>

                <section class="lotto-panel">
                    <div class="lotto-controls">
                        <label class="tool-label" for="line-count">Number of lines</label>
                        <select id="line-count" class="lotto-select">
                            <option value="1">1 line</option>
                            <option value="3" selected>3 lines</option>
                            <option value="5">5 lines</option>
                        </select>
                        <button id="generate-button" class="tool-button" type="button">Generate numbers</button>
                    </div>

                    <div id="lotto-results" class="lotto-results" aria-live="polite"></div>
                </section>
            </main>
            <footer class="site-footer" data-site-footer>
                <a href="../../index.html">© Yooshin Kim</a>
            </footer>
        </div>
    </body>
</html>
