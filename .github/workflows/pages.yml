name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 20 * * *'
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.prepare.outputs.artifact_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare site with the current date in Korea
        id: prepare
        shell: bash
        run: |
          site_dir="$RUNNER_TEMP/site"
          mkdir -p "$site_dir"
          git archive HEAD | tar -xf - -C "$site_dir"

          updated=$(TZ=Asia/Seoul date +%F)
          footer="$site_dir/scripts/footer.js"
          sed -i "s/^  const lastUpdated = .*/  const lastUpdated = \"$updated\";/" "$footer"
          grep -Fx "  const lastUpdated = \"$updated\";" "$footer"
          printf 'artifact_name=github-pages-%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Refresh conference deadlines
        shell: bash
        run: |
          deadlines="$RUNNER_TEMP/site/labs/conference-deadlines/deadline-data.js"
          venv="$RUNNER_TEMP/conference-deadlines-venv"
          sync_script="scripts/sync_conference_deadlines.py"

          if python3 -m venv "$venv" &&
             "$venv/bin/python" -m pip install --quiet --disable-pip-version-check PyYAML==6.0.3 &&
             "$venv/bin/python" "$sync_script" "$deadlines"; then
            exit 0
          fi

          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            echo "::error::Conference deadline sync failed. The published site remains available."
            exit 1
          fi

          echo "::warning::Conference deadline sync failed. Using the published or bundled snapshot."
          python3 "$sync_script" "$deadlines" --restore

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
