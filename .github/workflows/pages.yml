name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.prepare.outputs.artifact_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare site with the current date in Korea
        id: prepare
        shell: bash
        run: |
          site_dir="$RUNNER_TEMP/site"
          mkdir -p "$site_dir"
          git archive HEAD | tar -xf - -C "$site_dir"

          updated=$(TZ=Asia/Seoul date +%F)
          footer="$site_dir/scripts/footer.js"
          sed -i "s/^  const lastUpdated = .*/  const lastUpdated = \"$updated\";/" "$footer"
          grep -Fx "  const lastUpdated = \"$updated\";" "$footer"
          printf 'artifact_name=github-pages-%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
